hydra:
  job:
    chdir: false
    name: wind_regression
  run:
    dir: ${paths.outputs}/${hydra:job.name}

paths:
  raw_data_root: ../../data/uv10
  outputs: outputs
  stats: data/stats

dataset:
  type: ./swaither/datasets/wind.py::WindForecastDataset
  low_res_files:
    - ${paths.raw_data_root}/uv10_2019_2022_clipped_LRes.nc
  high_res_files:
    - ${paths.raw_data_root}/uv10_2019_clipped_HR.nc
    - ${paths.raw_data_root}/uv10_2020_clipped_HR.nc
    - ${paths.raw_data_root}/uv10_2021_clipped_HR.nc
    - ${paths.raw_data_root}/uv10_2022_clipped_HR.nc
  static_high_file: ${paths.raw_data_root}/fj_HR.nc
  low_res_variables: [u10, v10]
  high_res_variables: [u_10m, v_10m]
  output_variables: [u10, v10]
  invariant_variables: [elevation, land_sea_mask]
  stats_path: ${paths.stats}/wind_joint_2019_2022.json
  history_hours: 6
  forecast_horizon_hours: 72
  years: [2019, 2020, 2021, 2022]
  grid_channels: 4
  preload_low: true
  preload_dtype: float16
  normalize: true
  nan_policy: error
  engine: netcdf4

validation:
  batch_size: 1
  max_samples: 64
  dataset:
    type: ./swaither/datasets/wind.py::WindForecastDataset
    low_res_files:
      - ${paths.raw_data_root}/uv10_2023_clipped_LRes.nc
    high_res_files:
      - ${paths.raw_data_root}/uv10_2023_clipped_HR.nc
    static_high_file: ${paths.raw_data_root}/fj_HR.nc
    low_res_variables: [u10, v10]
    high_res_variables: [u_10m, v_10m]
    output_variables: [u10, v10]
    invariant_variables: [elevation, land_sea_mask]
    stats_path: ${paths.stats}/wind_joint_2019_2022.json
    history_hours: 6
    forecast_horizon_hours: 72
    years: [2023]
    grid_channels: 4
    preload_low: true
    preload_dtype: float16
    normalize: true
    nan_policy: error
    engine: netcdf4

model:
  unet:
    model_channels: 64
    channel_mult: [1, 2, 2]
    attn_resolutions: []
    dropout: 0.05
    embedding_type: zero
    use_apex_gn: false

training:
  seed: 42
  epochs: 150
  batch_size: 1
  gradient_accumulation_steps: 8
  num_workers: 2
  lr: 2.0e-4
  weight_decay: 1.0e-4
  lr_factor: 0.5
  lr_patience: 5
  early_stopping_patience: 15
  grad_clip: 1.0
  amp: true
  memory_probe: true
  max_samples: 0
  run_dir: ${paths.outputs}/wind_regression
  checkpoint_dir: ${paths.outputs}/wind_regression/checkpoints
  tensorboard_dir: ${paths.outputs}/tensorboard/wind_regression
  resume: null
