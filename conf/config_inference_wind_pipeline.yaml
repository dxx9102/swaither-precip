hydra:
  job:
    chdir: false
    name: wind_corr_diff_inference
  run:
    dir: ${paths.outputs}/${hydra:job.name}

paths:
  raw_data_root: ../../data/uv10
  outputs: outputs
  wind_generated: data/wind_generated
  stats: data/stats

checkpoints:
  regression: ${paths.outputs}/wind_step2_regression/checkpoints_regression/UNet.0.50000.mdlus
  diffusion: ${paths.outputs}/wind_step2_diffusion/checkpoints_diffusion/EDMPrecondSuperResolution.0.50000.mdlus

outputs:
  regression_file: ${paths.outputs}/wind_corr_diff_inference/wind_regression_2024.nc
  diffusion_file: ${paths.outputs}/wind_corr_diff_inference/wind_diffusion_daily00_2024.nc

dataset:
  type: ./swaither/datasets/wind.py::WindSuperResolutionDataset
  condition_files:
    - ${paths.wind_generated}/step1_conditions_2019_2024.nc
  high_res_files:
    - ${paths.raw_data_root}/uv10_2024_clipped_HR.nc
  static_high_file: ${paths.raw_data_root}/fj_HR.nc
  low_res_variables: [u10, v10]
  high_res_variables: [u_10m, v_10m]
  output_variables: [u10, v10]
  invariant_variables: [elevation, land_sea_mask]
  stats_path: ${paths.stats}/wind_step2_2019_2022.json
  leads: [1, 2, 3, 4, 5, 6]
  condition_sampling: all
  crop_mult: 16
  grid_channels: 4
  nan_policy: error

inference:
  mode: all
  diffusion_leads: [1, 3, 6]
  diffusion_initial_hour: 0
  num_ensembles: 12
  sampler_num_steps: 18
  sampler_solver: euler
  seed: 42
  print_every: 100
