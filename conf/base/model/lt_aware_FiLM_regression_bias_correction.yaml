name: lt_aware_FiLM_regression_bias_correction
  # Model type.
hr_mean_conditioning: False
  # No high-res conditioning for regression.

# Default model parameters.
model_args:
  N_grid_channels: 4
  # Number of channels for positional grid embeddings
  embedding_type: "zero"
  clamp_min: 0.0
  clamp_max: 100.0 #20
  n_leads: 24
  emb_dim: 64
  mlp_hidden: 256

