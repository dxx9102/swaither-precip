hydra:
  job:
    chdir: false

paths:
  raw_data_root: ../../data/uv10
  outputs: outputs
  wind_generated: data/wind_generated
  stats: data/stats

checkpoint: ${paths.outputs}/wind_step1_unet_72h/checkpoints/WindForecastUNet.best.mdlus
output_file: ${paths.wind_generated}/step1_conditions_2019_2024_72h.nc
years: [2019, 2020, 2021, 2022, 2023, 2024]
forecast_hours: 72
batch_size: 64
amp: true
max_initial_times: null
dataset:
  type: ./swaither/datasets/wind.py::WindForecastDataset
  low_res_files:
    - ${paths.raw_data_root}/uv10_2019_2022_clipped_LRes.nc
    - ${paths.raw_data_root}/uv10_2023_clipped_LRes.nc
    - ${paths.raw_data_root}/uv10_2024_clipped_LRes.nc
  static_low_file: ${paths.raw_data_root}/fj_LRes.nc
  input_variables: [u10, v10]
  output_variables: [u10, v10]
  invariant_variables: [elevation, land_sea_mask]
  stats_path: ${paths.stats}/wind_step1_2019_2022_72h.json
  history_hours: 6
  forecast_horizon_hours: 72
  years: [2019, 2020, 2021, 2022, 2023, 2024]
  grid_channels: 4
  preload_low: true
  preload_dtype: float16
  normalize: true
  nan_policy: error
