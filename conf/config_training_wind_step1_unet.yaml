hydra:
  job:
    chdir: false
    name: wind_step1_unet
  run:
    dir: ${paths.outputs}/${hydra:job.name}
  searchpath:
    - pkg://conf/base

defaults:
  - _self_

paths:
  raw_data_root: ../../data/uv10
  outputs: outputs
  wind_generated: data/wind_generated
  stats: data/stats

dataset:
  type: ./swaither/datasets/wind.py::WindForecastDataset
  low_res_files:
    - ${paths.raw_data_root}/uv10_2019_2022_clipped_LRes.nc
  static_low_file: ${paths.raw_data_root}/fj_LRes.nc
  input_variables: [u10, v10]
  output_variables: [u10, v10]
  invariant_variables: [elevation, land_sea_mask]
  stats_path: ${paths.stats}/wind_step1_2019_2022.json
  history_hours: 6
  forecast_horizon_hours: 1
  years: [2019, 2020, 2021, 2022]
  grid_channels: 4
  preload_low: true
  preload_dtype: float16
  normalize: true
  nan_policy: error

validation:
  batch_size: 64
  max_samples: 0
  dataset:
    type: ./swaither/datasets/wind.py::WindForecastDataset
    low_res_files:
      - ${paths.raw_data_root}/uv10_2023_clipped_LRes.nc
    static_low_file: ${paths.raw_data_root}/fj_LRes.nc
    input_variables: [u10, v10]
    output_variables: [u10, v10]
    invariant_variables: [elevation, land_sea_mask]
    stats_path: ${paths.stats}/wind_step1_2019_2022.json
    history_hours: 6
    forecast_horizon_hours: 1
    years: [2023]
    grid_channels: 4
    preload_low: true
    preload_dtype: float16
    normalize: true
    nan_policy: error

model:
  unet:
    model_channels: 64
    channel_mult: [1, 2, 2]
    attn_resolutions: []
    dropout: 0.05
    embedding_type: zero
    use_apex_gn: false

training:
  seed: 42
  epochs: 150
  batch_size: 32
  num_workers: 4
  lr: 2.0e-4
  weight_decay: 1.0e-4
  lr_factor: 0.5
  lr_patience: 5
  early_stopping_patience: 15
  grad_clip: 1.0
  amp: true
  memory_probe: true
  max_samples: 0
  run_dir: ${paths.outputs}/wind_step1_unet
  checkpoint_dir: ${paths.outputs}/wind_step1_unet/checkpoints
  tensorboard_dir: ${paths.outputs}/tensorboard/wind_step1_unet
  resume: null
