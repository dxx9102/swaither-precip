#
# Originally based on physicsnemo/examples/generative/corrdiff configs.
#
# Strategy-2 ablation: trains a CorrDiff regression U-Net directly from
# coarse AIFS atmospheric fields to high-res precipitation, bypassing
# the explicit Step-1 bias correction. Used in the paper as a proxy
# comparison for direct downscaling (Section 4.X). The full CorrDiff
# diffusion stage is not trained for this ablation due to computational cost.

hydra:
    job:
        chdir: false
        name: strategy2_regression_ablation
    run:
        dir: ./outputs/${hydra:job.name}
    searchpath:
        - pkg://conf/base

defaults:
    - _self_: null
    - dataset: custom
    - model: regression
    - model_size: mini
    - training: ${model}

# Dataset parameters.
# Strategy 2: low-res input is the multivariate AIFS state, high-res output
# is the radar-gauge observation. The low_res file provides the AIFS context;
# the high_res file provides the target.
dataset:
    type: ./swaither/datasets/downscaling_dataset.py::CustomDownscalingDatasetNoLeadFastLite_2
    stats_path: ./data/stats/stats_aifs_single_3day_biasCorrection.json
    low_res_file: ./data/AIFS_Single_pred_concat_2019_2023_SingleHori_3day_NoNeg_andLowResPrecipWetEnough_gamma.nc
    high_res_file: ./data/CPCH_processed_precipitation_2019_2023_concat_NotFlat_6hSUM_00_12_wetEnough_gamma_wElevation.nc
    input_variables: ["total_precipitation_NoNeg",
                      "convective_precipitation_NoNeg",
                      "total_cloud_cover",
                      "wind_10m_u",
                      "wind_10m_v",
                      "specific_humidity_500hPa",
                      "specific_humidity_850hPa",
                      "temperature_500hPa",
                      "temperature_850hPa",
                      "geopotential_500hPa",
                      "geopotential_850hPa"]
    output_variables: ["precip6h_cumulative_capped"]
    invariant_variables: ["altitude"]
    log_precip: True
    crop_mult: 16              # for high-res (target on CombiPrecip grid)
    interp_low_res: True       # interpolate low_res onto the high_res grid
    preload_low: True          # preload only low_res into RAM
    preload_dtype: "float16"   # halves memory use vs float32

# Training parameters
training:
    hp:
        lr: 2e-4
        batch_size_per_gpu: "auto"
        split_fraction: 0.8
        seed: 42
    io:
        print_progress_freq: 50
        validation_freq: 250
        save_checkpoint_freq: 10000

# Weights & Biases logging.
# Disabled by default; set `mode: online` and provide your `entity` to enable.
wandb:
    # Configure whether to use wandb: "offline", "online", "disabled"
    mode: disabled
    project: swaither-precip-strategy2-ablation
    entity: ""
    results_dir: "./wandb"
    watch_model: false